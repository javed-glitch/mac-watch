name: Keep-alive

# GitHub disables scheduled workflows in a public repo after 60 days without activity.
on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%Y-%m-%d > .keepalive
          git config user.name "mac-watch-bot"
          git config user.email "mac-watch-bot@users.noreply.github.com"
          git add .keepalive
          git commit -m "Keep-alive $(cat .keepalive)"
          git push
